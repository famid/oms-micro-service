version: '3.8'

services:
  # PostgreSQL service
  auth-postgres:
    image: postgres:latest
    container_name: auth-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "7433:${POSTGRES_PORT}"  # Load PostgreSQL port from .env
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Persistent volume for PostgreSQL data
    networks:
      - auth-network  # Connect to the custom network

  # pgAdmin service
  auth-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: auth-pgadmin
    restart: always
    ports:
      - ${PGADMIN_PORT}:80  # Load pgAdmin port from .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - auth-network  # Connect to the custom network

  # auth App (NestJS) service
  auth-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-app
    command: sh -c "npm run start:dev"
    ports:
      - "${APP_PORT}:3004"  # Map port 3002 on the host to port 3002 in the container
    environment:
      POSTGRES_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/
    volumes:
      - .:/usr/src/app
    restart: unless-stopped
    networks:
      - auth-network  # Connect to the custom network

volumes:
  postgres-data:  # Volume for PostgreSQL data

networks:
  auth-network:
    driver: bridge  # Custom Docker network
