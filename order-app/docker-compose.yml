version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: always
    env_file:
      - ./.env
    ports:
      - "${RABBITMQ_HOST_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
    networks:
      - order-network

  # PostgreSQL service
  order-postgres:
    image: postgres:latest
    container_name: order-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}  # Load PostgreSQL port from .env
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Persistent volume for PostgreSQL data
    networks:
      - order-network  # Connect to the custom network

  # Order App (NestJS) service
  order-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-app
    command: sh -c "npm run start:dev"
    ports:
      - "${APP_PORT}:3002"  # Map port 3002 on the host to port 3002 in the container
    environment:
      POSTGRES_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/
    volumes:
      - .:/usr/src/app
    restart: unless-stopped
    networks:
      - order-network  # Connect to the custom network

volumes:
  postgres-data:  # Volume for PostgreSQL data

networks:
  order-network:
    driver: bridge  # Custom Docker network
