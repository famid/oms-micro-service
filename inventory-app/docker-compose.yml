version: '3.8'

services:
  # MongoDB service
  mongo:
    image: mongo:latest
    container_name: inventory-mongo-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    ports:
      - ${MONGODB_PORT}:27017  # Load MongoDB port from .env
    volumes:
      - mongo-data:/data/db  # Persistent volume for MongoDB data
    networks:
      - inventory-network  # Connect to the custom network

  # Mongo-Express service
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - ${MONGO_EXPRESS_PORT}:8081  # Load Mongo-Express port from .env
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"  # Disable basic auth for Mongo-Express
    networks:
      - inventory-network  # Connect to the custom network

  # Inventory App (NestJS) service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app
    command: sh -c "npm run start:dev"
    ports:
      - "${APP_PORT}:3000"  # Map port 3000 on the host to port 3000 in the container
    environment:
      MONGODB_URI: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongo:27017/
    volumes:
      - .:/usr/src/app
    restart: unless-stopped
    networks:
      - inventory-network  # Connect to the custom network

volumes:
  mongo-data:  # Volume for MongoDB data

networks:
  inventory-network:
    driver: bridge  # Custom Docker network
