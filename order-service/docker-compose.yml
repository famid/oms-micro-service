version: '3.8'

services:
  order-service:
    container_name: order-service
    build:
      context: .
    command: sh -c "if [ \"$NODE_ENV\" = \"production\" ]; then npm start; else npm run start:dev; fi"
    ports:
      - "${APP_PORT}:${APP_PORT}" # Expose the application port
      - "${APP_DEBUG_PORT}:9229" # Debugging port in development
    networks:
      - order-network
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_PORT: ${APP_PORT}
      APP_DEBUG_PORT: ${APP_DEBUG_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres-order-service
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: 'Asia/Dhaka'
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    networks:
      - order-network
    restart: always

networks:
  order-network:
    driver: bridge
